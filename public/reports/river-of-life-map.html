<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLCP World Map — River of Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --paper:#eef3ee; --paper-raised:#ffffff; --ink:#16261f; --ink-soft:#4a5a52;
  --river:#1d7874; --river-deep:#0f4c4c; --clay:#c2622d; --line:#c7d4c9;
  --done:#4f8a5b; --dream:#c2622d;
}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Work Sans",Arial,sans-serif;}
*{box-sizing:border-box;}
#worldMap{position:absolute;inset:0;z-index:0;}
.topbar{
  position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:500;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:var(--paper-raised);border-bottom:1px solid var(--line);
  font-family:"Fraunces",Georgia,serif;
}
.topbar h1{font-size:1.2rem;margin:0;font-weight:600;}
.topbar .eyebrow{font-family:"Work Sans",sans-serif;font-size:0.8rem;color:var(--ink-soft);}
.topbar button{
  font-family:"Work Sans",sans-serif;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:8px;padding:9px 14px;font-size:0.88rem;cursor:pointer;
}
.topbar button:hover{border-color:var(--river);color:var(--river);}
.status-pill{
  position:absolute;bottom:18px;left:18px;z-index:500;background:var(--paper-raised);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:0.8rem;color:var(--ink-soft);
}
.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(15,25,20,0.55);z-index:1000;
  align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--paper-raised);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;
  padding:26px;position:relative;
}
.modal-close{
  position:absolute;top:14px;right:14px;border:none;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--ink-soft);
}
.modal h2{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;margin:0 0 2px;}
.modal .meta{color:var(--ink-soft);font-size:0.9rem;margin:0 0 18px;}
.modal .chart-wrap{height:320px;}
.modal .stats-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.modal .stat .num{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;display:block;}
.modal .stat .lbl{font-size:0.78rem;color:var(--ink-soft);}
.modal .stat.done .num{color:var(--done);}
.modal .stat.dream .num{color:var(--dream);}
.modal .stat.gap .num{color:var(--river);}
.leaflet-popup-content{font-family:"Work Sans",sans-serif;}
.popup-title{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.05rem;margin:0 0 2px;}
.popup-meta{font-size:0.82rem;color:var(--ink-soft);margin:0 0 10px;}
.popup-btn{
  display:inline-block;background:var(--river-deep);color:#fff;border:none;border-radius:6px;
  padding:7px 12px;font-size:0.85rem;cursor:pointer;font-family:"Work Sans",sans-serif;
}
.river-pin{
  background:var(--river-deep);color:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
.river-pin span{transform:rotate(45deg);font-size:14px;}
</style>
</head>
<body>

<div id="worldMap"></div>

<div class="topbar">
  <div>
    <h1>🌍 CLCP World Map</h1>
    <div class="eyebrow">River of Life — live across every participating community</div>
  </div>
  <button id="refreshBtn" type="button">↻ Refresh</button>
</div>

<div class="status-pill" id="statusPill">Loading communities…</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <h2 id="modalTitle">River of Life</h2>
    <p class="meta" id="modalMeta"></p>
    <div class="chart-wrap"><canvas id="modalChart"></canvas></div>
    <div class="stats-row">
      <div class="stat done"><span class="num" id="modalStatDone">–</span><span class="lbl">Where we are</span></div>
      <div class="stat dream"><span class="num" id="modalStatDream">–</span><span class="lbl">Where we dream to be</span></div>
      <div class="stat gap"><span class="num" id="modalStatGap">–</span><span class="lbl">River width</span></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Deployed Apps Script Web App for rafique@communitylifecompetence.org
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpKmyZuFezQbNBIYtwBeRoThq0U6R4BaKnZUiG0ZZl-WhuE--YlvmFcn88YNcAJlH-/exec";

  var map = L.map('worldMap', {worldCopyJump:true}).setView([15, 10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  var markersLayer = L.layerGroup().addTo(map);
  var modalChart = null;

  var riverIcon = L.divIcon({
    className: '',
    html: '<div class="river-pin"><span>🌊</span></div>',
    iconSize: [30,30],
    iconAnchor: [15,30],
    popupAnchor: [0,-28]
  });

  function avg(arr){ return arr.reduce(function(s,v){return s+v;},0) / arr.length; }

  function openModal(community){
    var practices = community.practices || [];
    var doneVals = practices.map(function(p){ return p.done; });
    var dreamVals = practices.map(function(p){ return p.dream; });
    var labels = practices.map(function(p){ return (p.emoji||'') + ' ' + p.name; });

    document.getElementById('modalTitle').textContent = community.dreamName || 'River of Life';
    document.getElementById('modalMeta').textContent =
      community.communityName + (community.country ? ', ' + community.country : '') +
      ' · last updated ' + new Date(community.timestamp).toLocaleDateString();

    var avgDone = avg(doneVals), avgDream = avg(dreamVals);
    document.getElementById('modalStatDone').textContent = avgDone.toFixed(1);
    document.getElementById('modalStatDream').textContent = avgDream.toFixed(1);
    document.getElementById('modalStatGap').textContent = (avgDream - avgDone).toFixed(1);

    if(modalChart) modalChart.destroy();
    var ctx = document.getElementById('modalChart').getContext('2d');
    modalChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {label:'Where we are', data:doneVals, borderColor:'#4f8a5b', backgroundColor:'#4f8a5b33', fill:true, tension:0.3, pointRadius:4},
          {label:'Where we dream to be', data:dreamVals, borderColor:'#c2622d', backgroundColor:'#c2622d26', fill:'-1', tension:0.3, pointRadius:4}
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index', intersect:false},
        plugins:{legend:{position:'top'}},
        scales:{ y:{min:0, max:5, ticks:{stepSize:1}}, x:{} }
      }
    });

    document.getElementById('modalBackdrop').classList.add('open');
  }

  document.getElementById('modalClose').addEventListener('click', function(){
    document.getElementById('modalBackdrop').classList.remove('open');
  });
  document.getElementById('modalBackdrop').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('open');
  });

  function loadCommunities(){
    var pill = document.getElementById('statusPill');
    pill.textContent = 'Loading communities…';
    fetch(APPS_SCRIPT_URL + '?action=latest')
      .then(function(r){ return r.json(); })
      .then(function(result){
        markersLayer.clearLayers();
        if(result.status !== 'ok'){
          pill.textContent = '⚠️ Could not load data: ' + (result.message || 'unknown error');
          return;
        }
        var communities = result.data || [];
        communities.forEach(function(c){
          if(c.lat === '' || c.lng === '' || c.lat === undefined) return;
          var marker = L.marker([c.lat, c.lng], {icon: riverIcon}).addTo(markersLayer);
          var practices = c.practices || [];
          var avgDone = practices.length ? avg(practices.map(function(p){return p.done;})).toFixed(1) : '–';
          var avgDream = practices.length ? avg(practices.map(function(p){return p.dream;})).toFixed(1) : '–';
          var popupEl = document.createElement('div');
          popupEl.innerHTML =
            '<p class="popup-title">' + escapeHtml(c.communityName) + '</p>' +
            '<p class="popup-meta">' + escapeHtml(c.country || '') + ' · ' + avgDone + ' → ' + avgDream + '</p>' +
            '<button class="popup-btn" type="button">View River of Life</button>';
          popupEl.querySelector('button').addEventListener('click', function(){ openModal(c); });
          marker.bindPopup(popupEl);
        });
        pill.textContent = communities.length + ' communit' + (communities.length===1?'y':'ies') +
          ' on the map · updated ' + new Date().toLocaleTimeString();
      })
      .catch(function(){
        pill.textContent = '⚠️ Could not reach the World Map server. Check your internet connection.';
      });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', loadCommunities);
  loadCommunities();
})();
</script>
</body>
</html>

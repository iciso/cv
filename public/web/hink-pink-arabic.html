<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg-1: #f0fdfa;
      --card-bg-2: #fffbeb;
      --text: #1e293b;
      --text-muted: #64748b;
      --arabic-font: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0f766e 0%, #1e293b 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: var(--text);
    }

    main {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    /* SLIDE STYLES */
    .slide {
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      padding: 2.5rem;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 500px;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .slide.active {
      display: flex;
    }

    /* Start Slide */
    .slide.start {
      background: linear-gradient(180deg, #ffffff 0%, #f0fdfa 100%);
      text-align: center;
      justify-content: center;
    }

    .start h1 {
      font-size: 2.2rem;
      color: var(--primary-dark);
      margin-bottom: 0.8rem;
    }

    .start p {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 2rem;
    }

    /* Round Banner Slide */
    .slide.round-intro {
      background: #f0fdfa;
      text-align: center;
      justify-content: center;
    }

    .round-badge {
      background: #ccfbf1;
      color: var(--primary-dark);
      font-weight: 700;
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .round-title {
      font-size: 2rem;
      color: var(--primary-dark);
      margin-bottom: 1rem;
    }

    .round-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 450px;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    /* QA Slide Layout */
    .slide-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .progress-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .slide-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-grow: 1;
      justify-content: center;
    }

    .english-clue {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    /* Reveal Answer Box */
    .answer-box {
      width: 100%;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      padding: 1.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.35s ease;
      visibility: hidden;
    }

    .answer-box.visible {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      background: #fffbeb;
      border: 2px solid var(--accent);
    }

    .arabic-pair {
      font-family: var(--arabic-font);
      font-size: 2.5rem;
      direction: rtl;
      color: var(--primary-dark);
      font-weight: bold;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .transliteration {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }

    .vocab-breakdown {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
      border-top: 1px solid #fef3c7;
      padding-top: 0.8rem;
    }

    /* Buttons */
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(13, 148, 136, 0.35);
    }

    .btn-secondary {
      background: var(--accent);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
    }

    .btn-secondary:hover {
      background: #b45309;
      box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
    }

    /* Finish Slide */
    .slide.finish {
      background: #0f766e;
      color: white;
      text-align: center;
      justify-content: center;
    }

    .finish h2 {
      font-size: 2.8rem;
      margin-bottom: 1rem;
    }

    .finish p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .slide {
        padding: 1.5rem;
        min-height: 440px;
      }
      .start h1 { font-size: 1.8rem; }
      .english-clue { font-size: 1.25rem; }
      .arabic-pair { font-size: 2rem; }
    }
  </style>
</head>

      container.innerHTML = "";

      const slideEl = document.createElement("section");
      slideEl.className = `slide ${data.type} active`;

      if (data.type === "start") {
        slideEl.innerHTML = `
          <div>
            <h1>${data.title}</h1>
            <p>${data.subtitle}</p>
          </div>
          <button class="btn" onclick="nextSlide()">Let's Get Started</button>
        `;
      } 
      else if (data.type === "round-intro") {
        slideEl.innerHTML = `
          <div>
            <span class="round-badge">${data.badge}</span>
            <h2 class="round-title">${data.title}</h2>
            <p class="round-desc">${data.desc}</p>
          </div>
          <button class="btn" onclick="nextSlide()">Start Round</button>
        `;
      } 
      else if (data.type === "qa") {
        slideEl.innerHTML = `
          <div class="slide-header">
            <span class="round-badge">${data.badge}</span>
            <span class="progress-text">Slide ${index} of ${gameData.length - 2}</span>
          </div>
          <div class="slide-content">
            <div class="english-clue">"${data.clue}"</div>
            <div class="answer-box" id="answerBox">
              <div class="arabic-pair">${data.arabic}</div>
              <div class="transliteration">${data.translit}</div>
              <div class="vocab-breakdown">${data.breakdown}</div>
            </div>
          </div>
          <button class="btn btn-secondary" id="actionBtn" onclick="revealAnswer()">Show Answer</button>
        `;
      } 
      else if (data.type === "finish") {
        slideEl.innerHTML = `
          <div>
            <h2>${data.title}</h2>
            <p>${data.subtitle}</p>
          </div>
          <button class="btn" style="background: white; color: var(--primary-dark);" onclick="restartGame()">Play Again</button>
        `;
        triggerConfetti();
      }

      container.appendChild(slideEl);
    }

    function revealAnswer() {
      const box = document.getElementById("answerBox");
      const btn = document.getElementById("actionBtn");

      if (box && !box.classList.contains("visible")) {
        box.classList.add("visible");
        btn.textContent = "Next Slide";
        btn.className = "btn";
        btn.onclick = nextSlide;
      }
    }

    function nextSlide() {
      if (currentSlide < gameData.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function restartGame() {
      currentSlide = 0;
      renderSlide(currentSlide);
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 150,
          spread: 90,
          origin: { y: 0.6 }
        });
      }
    }

    // Initialize first slide
    renderSlide(0);
  </script>
</body>
</html>
